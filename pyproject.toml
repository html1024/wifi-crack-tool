[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wlan-sec-test-tool"
version = "1.3.1"
description = "无线网络安全测试工具命令行入口"
requires-python = ">=3.11"

[project.scripts]
wlan-sec-test-tool-cli = "wlan_sec_test_tool_cli:main"
wstt = "wlan_sec_test_tool_cli:main"

[tool.setuptools]
py-modules = ["wlan_sec_test_tool_cli", "wifi_macos"]
